groups:
  - id: registry.trogon.eventstore.client.attributes
    type: attribute_group
    brief: TrogonEventStore client attributes.
    attributes:
      - id: trogon.eventstore.event.type
        type: string
        stability: development
        brief: The type of event received by the client.
        examples: [order-created]
      - id: trogon.eventstore.batch.correlation_id
        type: string
        stability: development
        brief: The identifier used to correlate a batch append request with its response.
        examples: ["00000000-0000-0000-0000-000000000000"]

  - id: span.trogon.eventstore.client
    type: span
    extends: span.db.client
    span_kind: client
    stability: development
    brief: A logical TrogonEventStore client operation.
    attributes:
      - ref: db.system.name
        requirement_level: required
        note: The value MUST be `trogoneventstore` and SHOULD be set when the span is created.
      - ref: db.operation.name
        requirement_level: required
      - ref: db.collection.name
        requirement_level:
          conditionally_required: If the operation targets a single stream.
      - ref: error.type
        requirement_level:
          conditionally_required: If and only if the operation failed.

  - id: span.trogon.eventstore.client.receive
    type: span
    span_kind: client
    stability: development
    brief: Receives an event delivered by a subscription.
    attributes:
      - ref: messaging.system
        requirement_level: required
      - ref: messaging.operation.name
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level: required
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.message.id
        requirement_level: recommended
      - ref: messaging.consumer.group.name
        requirement_level:
          conditionally_required: If the event was delivered by a persistent subscription.
      - ref: trogon.eventstore.event.type
        requirement_level: recommended

  - id: span.trogon.eventstore.client.append_to_stream
    type: span
    extends: span.trogon.eventstore.client
    span_kind: client
    stability: development
    brief: Appends events to a stream.
    annotations:
      code_generation:
        operation_name: append_to_stream

  - id: span.trogon.eventstore.client.set_stream_metadata
