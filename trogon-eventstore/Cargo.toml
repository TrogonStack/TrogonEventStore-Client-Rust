[package]
authors = ["Straw Hat, LLC"]
edition = "2024"
name = "trogon-eventstore"
version = "0.2.0"
publish = false

# Uncomment if you want to update messages.rs code-gen.
# We disabled codegen.rs because it requires having `protoc` installed on your machine
# in order to build that library.
# build = "codegen.rs"

description = "Community-maintained Rust gRPC client for TrogonEventStore"
keywords = ["database", "event-sourcing", "ddd", "cqrs", "eventstore"]
license = "Apache-2.0 AND MIT"
readme = "../README.md"
repository = "https://github.com/TrogonStack/TrogonEventStore-Client-Rust"

categories = ["database", "api-bindings"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bitflags = "2"
byteorder = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "serde",
    "now",
] }
trogon-eventstore-macros = { path = "../trogon-eventstore-macros", version = "0.2.0" }
futures = "0.3"
http = "1"
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2"] }
hyper-rustls = { version = "0.27", features = ["rustls-native-certs", "http2"] }
tracing = "0.1"
nom = "7"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
prost = "0.13"
prost-types = "0.13"
rand = { version = "0.9", features = ["small_rng"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-native-roots",
    "json",
] }
rustls = { version = "0.23" }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
tokio-rustls = "0.26"
tonic = { version = "0.13", features = ["tls-aws-lc", "tls-native-roots"] }
tower = "0.5"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1"
eyre = "0.6"

[build-dependencies]
tonic-build = { version = "0.13", features = ["prost-build"] }

[[test]]
name = "integration"

[dev-dependencies]
names = "0.14"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["testing", "trace"] }
serde = { version = "1", features = ["derive"] }
testcontainers = "0.23"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
toml = "0.8"
ctor = "0.4"

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "tracing-log"]
