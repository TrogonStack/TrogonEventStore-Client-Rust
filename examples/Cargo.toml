[package]
name = "examples"
version = "0.0.0"
publish = false
edition = "2024"

[dev-dependencies]
trogon-eventstore = { path = "../trogon-eventstore" }
futures = "0.3"
uuid = { version = "1.1", features = ["v4", "v5", "serde"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "appending_events"
path = "appending_events.rs"
crate-type = ["staticlib"]

[[example]]
name = "idempotent_reservation"
path = "idempotent_reservation.rs"

[[example]]
name = "quickstart"
path = "quickstart.rs"
crate-type = ["staticlib"]

[[example]]
name = "reading_events"
path = "reading_events.rs"
crate-type = ["staticlib"]

[[example]]
name = "server_side_filtering"
path = "server_side_filtering.rs"
crate-type = ["staticlib"]

[[example]]
name = "subscribing_to_stream"
path = "subscribing_to_stream.rs"
crate-type = ["staticlib"]

[[example]]
name = "persistent_subscriptions"
path = "persistent_subscriptions.rs"
crate-type = ["staticlib"]

[[example]]
name = "user_certificates"
path = "user_certificates.rs"
crate-type = ["staticlib"]
